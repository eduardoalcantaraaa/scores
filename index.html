<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedCore - Futuristic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@400;500;600&display=swap');

  :root { 
    --bg: #050914; 
    --glass: rgba(16, 25, 43, 0.7); 
    --glass-brd: rgba(56, 189, 248, 0.3); 
    --pri: #00f3ff; 
    --pri-dark: #0088cc;
    --txt: #e2e8f0; 
    --mut: #8b9bb4; 
    --ok: #00ff88; 
    --wr: #ffb800; 
    --dg: #ff3366; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  
  body { 
    background-color: var(--bg); 
    background-image: radial-gradient(circle at 50% 0%, #0a1c3a 0%, transparent 70%), 
                      linear-gradient(0deg, var(--bg) 0%, transparent 100%);
    color: var(--txt); 
    padding-bottom: 40px; 
    overflow-x: hidden; 
    min-height: 100vh;
  }

  h1, h2, .item-title, .drug-name { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

  /* HEADER FUTURISTA */
  header { 
    padding: 24px 20px; 
    text-align: center; 
    position: relative; 
    border-bottom: 1px solid var(--glass-brd);
    background: linear-gradient(180deg, rgba(0, 243, 255, 0.1) 0%, transparent 100%);
    box-shadow: 0 4px 30px rgba(0, 243, 255, 0.1);
  }
  header h1 { font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px var(--pri); cursor: pointer; }
  header p { font-size: 0.85rem; color: var(--pri); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; }
  
  .btn-guia { 
    position: absolute; top: 24px; right: 20px; 
    background: rgba(0, 243, 255, 0.1); 
    border: 1px solid var(--pri); 
    color: var(--pri); 
    padding: 8px 14px; 
    border-radius: 4px; 
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    cursor: pointer; 
    transition: all 0.3s;
    box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
  }
  .btn-guia:hover { background: var(--pri); color: var(--bg); box-shadow: 0 0 20px var(--pri); }

  input[type="text"] { 
    width: 100%; max-width: 600px; 
    padding: 14px 16px; 
    border-radius: 8px; 
    border: 1px solid var(--glass-brd); 
    margin-top: 20px; 
    background: var(--glass); 
    color: #fff; 
    font-size: 1rem; 
    backdrop-filter: blur(10px);
    transition: all 0.3s;
  }
  input[type="text"]:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }

  .container { max-width: 900px; margin: 30px auto; padding: 0 16px; }
  .pg { display: none; animation: fadeIn 0.4s ease-out; }
  .pg.on { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .back { background: none; border: none; color: var(--pri); font-size: 0.9rem; font-family: 'Orbitron', sans-serif; cursor: pointer; margin-bottom: 20px; padding: 8px 0; text-transform: uppercase; letter-spacing: 1px; }
  .back:hover { text-shadow: 0 0 8px var(--pri); }
  
  .title { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid var(--glass-brd); padding-bottom: 10px; color: var(--pri); }

  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
  
  /* CARDS FUTURISTAS */
  .item { 
    background: var(--glass); 
    border: 1px solid var(--glass-brd); 
    border-radius: 12px; 
    padding: 20px; 
    cursor: pointer; 
    display: flex; justify-content: space-between; align-items: center; 
    text-align: left; color: var(--txt); 
    backdrop-filter: blur(10px);
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .item::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--pri); transition: 0.3s; }
  .item:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 243, 255, 0.15); border-color: var(--pri); }
  .item:hover::before { width: 100%; opacity: 0.1; }
  
  .item-title { font-size: 1rem; color: #fff; }
  .item-desc { font-size: 0.8rem; color: var(--mut); margin-top: 6px; line-height: 1.4; }
  .badge { font-size: 0.8rem; background: rgba(0, 243, 255, 0.1); border: 1px solid var(--pri); color: var(--pri); padding: 4px 10px; border-radius: 20px; font-weight: 600; }

  /* FORMULÁRIO DE SCORES */
  .card { background: var(--glass); border-radius: 16px; padding: 24px; border: 1px solid var(--glass-brd); backdrop-filter: blur(10px); }
  .q { padding: 16px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
  .q:last-child { border-bottom: none; }
  .q-title { display: block; font-size: 0.95rem; margin-bottom: 12px; font-weight: 500; color: #fff; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opts label { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid transparent; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
  .opts label:hover { background: rgba(0, 243, 255, 0.05); border-color: rgba(0, 243, 255, 0.3); }
  input[type="radio"] { accent-color: var(--pri); width: 18px; height: 18px; }
  input[type="number"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-brd); background: rgba(0,0,0,0.3); color: var(--txt); font-size: 1rem; }
  
  .btn-row { display: flex; gap: 12px; margin-top: 24px; }
  .btn { background: var(--pri); color: var(--bg); border: none; padding: 14px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; flex: 1; font-size: 1rem; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); }
  .btn:hover { background: #fff; box-shadow: 0 0 25px #fff; }
  .btn.sec { background: transparent; color: var(--mut); border: 1px solid var(--mut); box-shadow: none; flex: 0; padding: 14px 24px; }
  .btn.sec:hover { background: rgba(255,255,255,0.1); color: #fff; box-shadow: none; }
  
  .res { display: none; margin-top: 24px; padding: 20px; border-radius: 12px; border-left: 4px solid var(--pri); background: rgba(0, 243, 255, 0.05); }
  .res.on { display: block; animation: fadeIn 0.3s; }
  .val { font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: bold; color: var(--pri); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
  .txt { font-size: 1rem; margin-top: 8px; font-weight: 500; color: #fff; }
  .low { border-color: var(--ok); background: rgba(0, 255, 136, 0.05); } .low .val { color: var(--ok); text-shadow: 0 0 10px rgba(0, 255, 136, 0.5); }
  .mid { border-color: var(--wr); background: rgba(255, 184, 0, 0.05); } .mid .val { color: var(--wr); text-shadow: 0 0 10px rgba(255, 184, 0, 0.5); }
  .high { border-color: var(--dg); background: rgba(255, 51, 102, 0.05); } .high .val { color: var(--dg); text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
  .empty { text-align: center; color: var(--mut); padding: 20px; display: none; }

  /* SIDEBAR (GUIA DE PRESCRIÇÃO) */
  #sidebar { position: fixed; top: 0; right: -100%; width: 90%; max-width: 420px; height: 100%; background: rgba(8, 14, 26, 0.95); z-index: 1000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 24px; overflow-y: auto; border-left: 1px solid var(--pri); box-shadow: -10px 0 30px rgba(0, 243, 255, 0.1); backdrop-filter: blur(15px); }
  #sidebar.open { right: 0; }
  #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; display: none; backdrop-filter: blur(3px); }
  #overlay.open { display: block; }
  
  .drug-card { background: rgba(255,255,255,0.02); padding: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); border-left: 3px solid var(--pri); margin-bottom: 12px; transition: 0.2s; }
  .drug-card:hover { background: rgba(0, 243, 255, 0.05); border-color: var(--pri); }
  .drug-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .drug-name { color: #fff; font-size: 1rem; }
  .drug-class { font-size: 0.7rem; background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); padding: 2px 8px; border-radius: 4px; color: var(--pri); text-transform: uppercase; letter-spacing: 0.5px; }
  .drug-dose { font-size: 0.9rem; color: #ddd; line-height: 1.4; }
  .drug-obs { font-size: 0.8rem; color: var(--wr); margin-top: 8px; background: rgba(255, 184, 0, 0.1); padding: 8px; border-radius: 6px; }
</style>
</head>
<body>

<header>
  <h1 onclick="nav('esp')">MedCore</h1>
  <button class="btn-guia" onclick="toggleSidebar()">💊 Guia</button>
  <p id="sub">Selecione a especialidade</p>
  <div id="search-box"><input type="text" id="search" placeholder="🔍 Buscar score..."></div>
</header>

<!-- SIDEBAR -->
<div id="sidebar">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="font-size:1.2rem; color:var(--pri);">💊 Prescrição</h2>
    <button onclick="toggleSidebar()" style="background:none; border:none; color:var(--mut); font-size:1.5rem; cursor:pointer;">✕</button>
  </div>
  <input type="text" id="search-drug" placeholder="🔍 Buscar medicamento..." style="margin-top:0; margin-bottom:20px;">
  <div id="drug-list"></div>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div class="container">
  <div id="pg-esp" class="pg on">
    <div class="grid" id="list-esp"></div>
    <div class="empty" id="empty-esp">Nenhum resultado encontrado.</div>
  </div>

  <div id="pg-score" class="pg">
    <button class="back" onclick="nav('esp')">← Voltar</button>
    <h2 class="title" id="title-score"></h2>
    <div class="grid" id="list-score"></div>
    <div class="empty" id="empty-score">Nenhum resultado encontrado.</div>
  </div>

  <div id="pg-quiz" class="pg">
    <button class="back" onclick="nav('score')">← Voltar</button>
    <div class="card">
      <h2 id="q-title" style="color:var(--pri); font-size:1.2rem;"></h2>
      <p id="q-desc" style="color:var(--mut); font-size:0.85rem; margin-bottom:20px;"></p>
      <div id="q-form"></div>
      <div class="btn-row">
        <button class="btn" onclick="calc()">Calcular</button>
        <button class="btn sec" onclick="reset()">Limpar</button>
      </div>
      <div id="q-res" class="res"></div>
    </div>
  </div>
</div>

<script>
const DB = [
  { c: 'Cardiologia', n: 'CHA₂DS₂-VASc', d: 'Risco de AVC em FA.', f: [['IC / Disf. VE', [['Não', 0], ['Sim', 1]]], ['Hipertensão', [['Não', 0], ['Sim', 1]]], ['Idade', [['< 65', 0], ['65-74', 1], ['≥ 75', 2]]], ['Diabetes', [['Não', 0], ['Sim', 1]]], ['AVC/AIT prévio', [['Não', 0], ['Sim', 2]]], ['Doença vascular', [['Não', 0], ['Sim', 1]]], ['Sexo', [['Masc', 0], ['Fem', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s===0?'Baixo risco':s===1?'Risco intermediário':'Alto risco', r: s===0?'low':s===1?'mid':'high' }; } },
  { c: 'Cardiologia', n: 'HAS-BLED', d: 'Risco de sangramento.', f: [['Hipertensão', [['Não', 0], ['Sim', 1]]], ['Função renal alterada', [['Não', 0], ['Sim', 1]]], ['Função hepática alterada', [['Não', 0], ['Sim', 1]]], ['AVC prévio', [['Não', 0], ['Sim', 1]]], ['Sangramento prévio', [['Não', 0], ['Sim', 1]]], ['INR lábil', [['Não', 0], ['Sim', 1]]], ['Idade > 65', [['Não', 0], ['Sim', 1]]], ['Drogas/Álcool', [['Não', 0], ['Sim', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s<=2?'Risco baixo/moderado':'Alto risco', r: s<=2?'low':'high' }; } },
  { c: 'Cardiologia', n: 'TIMI (SCA)', d: 'Risco em SCA sem supra.', f: [['Idade ≥ 65', [['Não', 0], ['Sim', 1]]], ['≥ 3 fatores risco', [['Não', 0], ['Sim', 1]]], ['DAC conhecida', [['Não', 0], ['Sim', 1]]], ['AAS recente', [['Não', 0], ['Sim', 1]]], ['Angina grave', [['Não', 0], ['Sim', 1]]], ['Alteração ST', [['Não', 0], ['Sim', 1]]], ['Marcadores necrose', [['Não', 0], ['Sim', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s<=2?'Baixo':s<=4?'Interm.':'Alto', r: s<=2?'low':s<=4?'mid':'high' }; } },
  { c: 'Pneumologia', n: 'CURB-65', d: 'Gravidade de pneumonia.', f: [['Confusão', [['Não', 0], ['Sim', 1]]], ['Ureia > 42', [['Não', 0], ['Sim', 1]]], ['FR ≥ 30', [['Não', 0], ['Sim', 1]]], ['PA baixa', [['Não', 0], ['Sim', 1]]], ['Idade ≥ 65', [['Não', 0], ['Sim', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s<=1?'Baixo':s===2?'Interm.':'Alto', r: s<=1?'low':s===2?'mid':'high' }; } },
  { c: 'Pneumologia', n: 'Wells (TEP)', d: 'Probabilidade de TEP.', f: [['Sinais TVP', [['Não', 0], ['Sim', 3]]], ['TEP + provável', [['Não', 0], ['Sim', 3]]], ['FC > 100', [['Não', 0], ['Sim', 1.5]]], ['Imobilização', [['Não', 0], ['Sim', 1.5]]], ['TVP/TEP prévio', [['Não', 0], ['Sim', 1.5]]], ['Hemoptise', [['Não', 0], ['Sim', 1]]], ['Câncer ativo', [['Não', 0], ['Sim', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s.toFixed(1), t: s<=4?'Baixa':s<=6?'Moderada':'Alta', r: s<=4?'low':s<=6?'mid':'high' }; } },
  { c: 'Neurologia', n: 'Glasgow', d: 'Nível de consciência.', f: [['Abertura ocular', [['Espontânea', 4], ['Chamado', 3], ['Dor', 2], ['Ausente', 1]]], ['Resposta verbal', [['Orientado', 5], ['Confuso', 4], ['Inapropriado', 3], ['Sons', 2], ['Ausente', 1]]], ['Resposta motora', [['Obedece', 6], ['Localiza', 5], ['Retirada', 4], ['Flexão', 3], ['Extensão', 2], ['Ausente', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s>=13?'Leve':s>=9?'Moderado':'Grave', r: s>=13?'low':s>=9?'mid':'high' }; } },
  { c: 'Neurologia', n: 'NIHSS', d: 'Gravidade do AVC.', f: [['Consciência', [['Alerta', 0], ['Sonolento', 1], ['Estupor', 2], ['Coma', 3]]], ['Olhar', [['Normal', 0], ['Paresia', 1], ['Desvio', 2]]], ['Campo visual', [['Normal', 0], ['Parcial', 1], ['Completa', 2], ['Cegueira', 3]]], ['Paresia facial', [['Normal', 0], ['Leve', 1], ['Moderada', 2], ['Completa', 3]]], ['Motor braço', [['Normal', 0], ['Leve', 1], ['Moderada', 2], ['Grave', 3], ['Plegia', 4]]], ['Motor perna', [['Normal', 0], ['Leve', 1], ['Moderada', 2], ['Grave', 3], ['Plegia', 4]]], ['Ataxia', [['Ausente', 0], ['1', 1], ['2', 2]]], ['Sensibilidade', [['Normal', 0], ['Leve', 1], ['Grave', 2]]], ['Linguagem', [['Normal', 0], ['Leve', 1], ['Grave', 2], ['Global', 3]]], ['Disartria', [['Normal', 0], ['Leve', 1], ['Grave', 2]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s===0?'Sem déficit':s<=4?'Leve':s<=15?'Moderado':s<=20?'Mod/Grave':'Grave', r: s<=4?'low':s<=15?'mid':'high' }; } },
  { c: 'Nefrologia', n: 'TFG (CKD-EPI)', d: 'Filtração glomerular.', f: [['Sexo', [['Masc', 'M'], ['Fem', 'F']]], ['Idade (anos)', 'num-idade'], ['Creatinina (mg/dL)', 'num-cr']], calc: (v, i) => { const id = parseFloat(i.idade), cr = parseFloat(i.cr); if(!id||!cr) return { v: '-', t: 'Preencha', r: 'mid' }; const k = v[0]==='F'?0.7:0.9, a = v[0]==='F'?-0.241:-0.302, r = cr/k; let tfg = 142*Math.pow(Math.min(r,1),a)*Math.pow(Math.max(r,1),-1.2)*Math.pow(0.9938,id); if(v[0]==='F') tfg*=1.012; return { v: tfg.toFixed(1), t: tfg>=90?'G1':tfg>=60?'G2':tfg>=45?'G3a':tfg>=30?'G3b':tfg>=15?'G4':'G5', r: tfg>=60?'low':tfg>=30?'mid':'high' }; } },

  { c: 'Gastro', n: 'Blatchford', d: 'Hemorragia digestiva.', f: [['Ureia', [['< 40', 0], ['40-48', 2], ['49-70', 3], ['71-100', 4], ['101-140', 5], ['> 140', 6]]], ['Hb Homem', [['≥ 13', 0], ['12-12.9', 1], ['10-11.9', 3], ['< 10', 6]]], ['Hb Mulher', [['≥ 12', 0], ['10-11.9', 1], ['< 10', 6]]], ['PAS', [['≥ 110', 0], ['100-109', 1], ['90-99', 2], ['< 90', 3]]], ['FC ≥ 100', [['Não', 0], ['Sim', 1]]], ['Melena', [['Não', 0], ['Sim', 1]]], ['Síncope', [['Não', 0], ['Sim', 2]]], ['Hepatopatia', [['Não', 0], ['Sim', 2]]], ['IC', [['Não', 0], ['Sim', 2]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s===0?'Muito baixo':s<=5?'Baixo':'Alto', r: s===0?'low':s<=5?'mid':'high' }; } },
  { c: 'Infecto', n: 'qSOFA', d: 'Sepse.', f: [['FR ≥ 22', [['Não', 0], ['Sim', 1]]], ['Alt. mental', [['Não', 0], ['Sim', 1]]], ['PAS ≤ 100', [['Não', 0], ['Sim', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s<2?'Baixo':'Alto', r: s<2?'low':'high' }; } },
  { c: 'Pediatria', n: 'Apgar', d: 'Avaliação do RN.', f: [['FC', [['Ausente', 0], ['< 100', 1], ['> 100', 2]]], ['Respiração', [['Ausente', 0], ['Lenta', 1], ['Choro', 2]]], ['Tônus', [['Flácido', 0], ['Flexão', 1], ['Ativo', 2]]], ['Reflexo', [['Nenhum', 0], ['Careta', 1], ['Choro', 2]]], ['Cor', [['Cianose', 0], ['Acro', 1], ['Rosado', 2]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s>=7?'Boa vitalidade':s>=4?'Depressão mod.':'Grave', r: s>=7?'low':s>=4?'mid':'high' }; } },
  { c: 'Cirurgia', n: 'Alvarado', d: 'Apendicite.', f: [['Migração FID', [['Não', 0], ['Sim', 1]]], ['Anorexia', [['Não', 0], ['Sim', 1]]], ['Náusea', [['Não', 0], ['Sim', 1]]], ['Dor FID', [['Não', 0], ['Sim', 2]]], ['Blumberg', [['Não', 0], ['Sim', 1]]], ['Temp > 37.3', [['Não', 0], ['Sim', 1]]], ['Leucocitose', [['Não', 0], ['Sim', 2]]], ['Neutrofilia', [['Não', 0], ['Sim', 1]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s<=4?'Improvável':s<=6?'Possível':'Provável', r: s<=4?'low':s<=6?'mid':'high' }; } },
  { c: 'Cirurgia', n: 'Wells (TVP)', d: 'Trombose Venosa.', f: [['Câncer', [['Não', 0], ['Sim', 1]]], ['Paralisia', [['Não', 0], ['Sim', 1]]], ['Acamado', [['Não', 0], ['Sim', 1]]], ['Dor trajeto', [['Não', 0], ['Sim', 1]]], ['Edema', [['Não', 0], ['Sim', 1]]], ['Cacifo', [['Não', 0], ['Sim', 1]]], ['Colaterais', [['Não', 0], ['Sim', 1]]], ['TVP prévia', [['Não', 0], ['Sim', 1]]], ['Alt. provável', [['Não', 0], ['Sim', -2]]]], calc: v => { const s = v.reduce((a,b)=>a+b,0); return { v: s, t: s<=0?'Baixa':s<=2?'Moderada':'Alta', r: s<=0?'low':s<=2?'mid':'high' }; } }

// ==========================================
// 4. LÓGICA DE NAVEGAÇÃO E SCORES
// ==========================================
let currentCat = '', currentScore = null;

function nav(pg) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
  document.getElementById('pg-' + pg).classList.add('on');
  document.getElementById('search').value = '';
  window.scrollTo(0, 0);
  
  if (pg === 'esp') {
    document.getElementById('sub').innerText = 'Selecione a especialidade';
    document.getElementById('search-box').style.display = 'block';
    renderEsp();
  } else if (pg === 'score') {
    document.getElementById('sub').innerText = currentCat;
    document.getElementById('search-box').style.display = 'block';
    renderScores();
  } else if (pg === 'quiz') {
    document.getElementById('sub').innerText = currentScore.n;
    document.getElementById('search-box').style.display = 'none';
  }
}

function renderEsp() {
  const q = document.getElementById('search').value.toLowerCase();
  const cats = [...new Set(DB.map(s => s.c))];
  let html = '', count = 0;
  
  cats.forEach(c => {
    const scores = DB.filter(s => s.c === c);
    if (q && !scores.some(s => s.n.toLowerCase().includes(q) || s.d.toLowerCase().includes(q)) && !c.toLowerCase().includes(q)) return;
    count++;
    html += `<div class="item" onclick="currentCat='${c}'; nav('score')"><span class="item-title">${c}</span><span class="badge">${scores.length}</span></div>`;
  });
  
  document.getElementById('list-esp').innerHTML = html;
  document.getElementById('empty-esp').style.display = count === 0 ? 'block' : 'none';
}

function renderScores() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = DB.filter(s => s.c === currentCat && (s.n.toLowerCase().includes(q) || s.d.toLowerCase().includes(q)));
  let html = '';
  
  filtered.forEach((s) => {
    const idx = DB.indexOf(s);
    html += `<div class="item" onclick="openQuiz(${idx})"><div><div class="item-title">${s.n}</div><div class="item-desc">${s.d}</div></div><div style="font-size:1.5rem;color:var(--mut)">›</div></div>`;
  });
  
  document.getElementById('list-score').innerHTML = html;
  document.getElementById('empty-score').style.display = filtered.length === 0 ? 'block' : 'none';
}

function openQuiz(idx) {
  currentScore = DB[idx];
  document.getElementById('q-title').innerText = currentScore.n;
  document.getElementById('q-desc').innerText = currentScore.d;
  document.getElementById('q-res').className = 'res';
  
  let html = '';
  currentScore.f.forEach((f, i) => {
    html += `<div class="q"><label class="q-title">${f[0]}</label>`;
    if (f[1] === 'num-idade' || f[1] === 'num-cr') {
      html += `<input type="number" step="any" class="num-${f[1].split('-')[1]}" placeholder="Digite...">`;
    } else {
      html += `<div class="opts">`;
      f[1].forEach((o, j) => {
        html += `<label><input type="radio" name="q${i}" value="${o[1]}" ${j===0?'checked':''}>${o[0]}</label>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });
  document.getElementById('q-form').innerHTML = html;
  nav('quiz');
}

function calc() {
  const radios = document.querySelectorAll('input[type="radio"]:checked');
  const v = Array.from(radios).map(r => parseFloat(r.value));
  const inputs = {};
  document.querySelectorAll('input[type="number"]').forEach(n => {
    inputs[n.className.replace('num-', '')] = n.value;
  });
  
  const res = currentScore.calc(v, inputs);
  const box = document.getElementById('q-res');
  box.className = 'res on ' + res.r;
  box.innerHTML = `<div class="val">${res.v}</div><div class="txt">${res.t}</div>`;
}

function reset() {
  document.getElementById('q-form').querySelectorAll('input').forEach(i => {
    if (i.type === 'radio') i.checked = i.parentElement.parentElement.children[0] === i.parentElement;
    if (i.type === 'number') i.value = '';
  });
  document.getElementById('q-res').className = 'res';
}

document.getElementById('search').addEventListener('input', () => {
  if (document.getElementById('pg-esp').classList.contains('on')) renderEsp();
  if (document.getElementById('pg-score').classList.contains('on')) renderScores();
});

// ==========================================
// 5. LÓGICA DO GUIA DE PRESCRIÇÃO (SIDEBAR)
// ==========================================
function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  if (sb.classList.contains('open')) {
    sb.classList.remove('open');
    ov.classList.remove('open');
  } else {
    sb.classList.add('open');
    ov.classList.add('open');
  }
}

function renderDrugs() {
  const q = document.getElementById('search-drug').value.toLowerCase();
  const list = document.getElementById('drug-list');
  list.innerHTML = '';
  
  const filtered = guiaRemedios.filter(d => d.nome.toLowerCase().includes(q) || d.classe.toLowerCase().includes(q) || d.dose.toLowerCase().includes(q));
  
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center; color:var(--mut); margin-top:20px;">Nenhum remédio encontrado.</div>';
    return;
  }

  filtered.forEach(d => {
    list.innerHTML += `
      <div class="drug-card">
        <div class="drug-header">
          <span class="drug-name">${d.nome}</span>
          <span class="drug-class">${d.classe}</span>
        </div>
        <div class="drug-dose"><strong>Dose:</strong> ${d.dose}</div>
        <div class="drug-obs">⚠️ ${d.obs}</div>
      </div>
    `;
  });
}

document.getElementById('search-drug').addEventListener('input', renderDrugs);
renderDrugs(); // Inicia a lista

// Inicializa o App
nav('esp');
</script>
